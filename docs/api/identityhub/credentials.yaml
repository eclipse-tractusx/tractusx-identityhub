openapi: 3.0.1
info:
  title: "IdentityHub Credentials (DCP) API"
  description: "Decentralised Claims Protocol endpoints: presentation queries, credential offers and storage."
  version: "1.0.0"
servers:
- description: Local development runtime
  url: http://localhost:13131/api/credentials
security:
- Authentication: []
paths:
  /v1/participants/{participantContextId}/credentials:
    post:
      description: Writes a set of credentials into storage
      operationId: storeCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialMessage"
      responses:
        "200":
          description: The credentialMessage was successfully processed and stored
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The given authentication token could not be validated. This\
            \ can happen, when the request body calls for a broader credentialMessage\
            \ scope than the granted scope in the auth token"
      tags:
      - Storage API
  /v1/participants/{participantContextId}/offers:
    post:
      description: Notifies the holder about the availability of a particular credential
        for issuance
      operationId: offerCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              externalDocs:
                description: DCP Credential Offer API
                url: https://eclipse-dataspace-dcp.github.io/decentralized-claims-protocol
      responses:
        "204":
          description: The offer notification was successfully received.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The given authentication token could not be validated.
      tags:
      - Credential Offer API
  /v1/participants/{participantContextId}/presentations/query:
    post:
      description: "Issues a new presentation query, that contains either a DIF presentation\
        \ definition, or a list of scopes"
      operationId: queryPresentation
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationQueryMessage"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseMessage"
          description: "The query was successfully processed, the response contains\
            \ the VerifiablePresentation"
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, for example when both scope and\
            \ presentationDefinition are given"
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The given authentication token could not be validated. This\
            \ can happen, when the request body calls for a broader query scope than\
            \ the granted scope in the auth token"
        "501":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "When the request contained a presentationDefinition object,\
            \ but the implementation does not support it."
      tags:
      - Presentation API
components:
  schemas:
    ApiErrorDetail:
      type: object
      example:
        message: error message
        type: ErrorType
        path: object.error.path
        invalidValue: this value is not valid
      properties:
        invalidValue:
          type: string
        message:
          type: string
        path:
          type: string
        type:
          type: string
    CredentialContainerSchema:
      type: object
      example:
        credentialType: MembershipCredential
        payload: ""
        format: jwt
    CredentialMessage:
      type: object
      example:
        '@context':
        - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
        type: CredentialMessage
        credentials:
        - credentialType: MembershipCredential
          payload: ""
          format: jwt
        - credentialType: OrganizationCredential
          payload: ""
          format: json-ld
        requestId: requestId
      properties:
        '@context':
          type: object
        '@type':
          type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialContainerSchema"
        requestId:
          type: string
      required:
      - '@context'
      - '@type'
      - credentials
      - requestId
    JsonObject:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      properties:
        empty:
          type: boolean
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    JsonValue:
      type: object
      properties:
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    PresentationDefinitionSchema:
      type: object
      example: |
        {
          "comment": "taken from https://identity.foundation/presentation-exchange/spec/v2.0.0/#presentation-definition"
          "presentationDefinition": {
            "id": "first simple example",
            "input_descriptors": [
              {
                "id": "A specific type of VC",
                "name": "A specific type of VC",
                "purpose": "We want a VC of this type",
                "constraints": {
                  "fields": [
                    {
                      "path": [
                        "$.type"
                      ],
                      "filter": {
                        "type": "string",
                        "pattern": "<the type of VC e.g. degree certificate>"
                      }
                    }
                  ]
                }
              }
            ]
          }
        }
    PresentationQueryMessage:
      type: object
      example:
        '@context':
        - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
        - https://identity.foundation/presentation-exchange/submission/v1
        '@type': PresentationQueryMessage
        presentationDefinition: null
        scope:
        - org.eclipse.dspace.dcp.vc.type:SomeCredential_0.3.5:write
        - org.eclipse.dspace.dcp.vc.type:SomeOtherCredential:read
        - org.eclipse.dspace.dcp.vc.type:ThirdCredential:*
      properties:
        '@context':
          type: object
        '@type':
          type: string
        presentationDefinition:
          $ref: "#/components/schemas/PresentationDefinitionSchema"
        scope:
          type: array
          items:
            type: string
      required:
      - '@context'
      - '@type'
    PresentationResponseMessage:
      type: object
      example:
        '@context':
        - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
        '@type': PresentationResponseMessage
        presentation:
        - dsJdh...UMetV
      properties:
        '@context':
          type: object
        presentation:
          type: array
          items:
            type: object
            anyOf:
            - type: string
            - $ref: "#/components/schemas/JsonObject"
      required:
      - '@context'
      - presentation
  securitySchemes:
    Authentication:
      bearerFormat: JWT
      description: Self-Issued ID token containing an access_token
      scheme: bearer
      type: http
