components:
  schemas:
    Action:
      type: object
      properties:
        constraint:
          $ref: "#/components/schemas/Constraint"
        includedIn:
          type: string
        type:
          type: string
    ApiErrorDetail:
      type: object
      properties:
        invalidValue:
          type: object
        message:
          type: string
        path:
          type: string
        type:
          type: string
    Constraint:
      type: object
      discriminator:
        propertyName: edctype
      properties:
        edctype:
          type: string
      required:
      - edctype
    CreateParticipantContextResponse:
      type: object
      properties:
        apiKey:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
    CredentialDescriptor:
      type: object
      properties:
        format:
          type: string
        id:
          type: string
        type:
          type: string
    CredentialRequestDto:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialDescriptor"
        holderPid:
          type: string
        issuerDid:
          type: string
      required:
      - credentials
      - issuerDid
    CredentialSchema:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
    CredentialStatus:
      type: object
      properties:
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
        type:
          type: string
    CredentialSubject:
      type: object
      properties:
        claims:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
    Criterion:
      type: object
      properties:
        operandLeft:
          type: object
        operandRight:
          type: object
        operator:
          type: string
    DidDocument:
      type: object
      properties:
        '@context':
          type: array
          items:
            type: object
        authentication:
          type: array
          items:
            type: string
        id:
          type: string
        service:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        verificationMethod:
          type: array
          items:
            $ref: "#/components/schemas/VerificationMethod"
    DidRequestPayload:
      type: object
      properties:
        did:
          type: string
    Duty:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
        consequences:
          type: array
          items:
            $ref: "#/components/schemas/Duty"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/Constraint"
    HolderCredentialRequestDto:
      type: object
      properties:
        holderPid:
          type: string
        issuerDid:
          type: string
        issuerPid:
          type: string
        status:
          type: string
        typesAndFormats:
          type: array
          items:
            $ref: "#/components/schemas/RequestedCredential"
    IdentityHubParticipantContext:
      type: object
      properties:
        apiTokenAlias:
          type: string
        createdAt:
          type: integer
          format: int64
        did:
          type: string
        id:
          type: string
        lastModified:
          type: integer
          format: int64
        participantContextId:
          type: string
        properties:
          type: object
          additionalProperties:
            type: object
        scopes:
          type: array
          items:
            type: string
        state:
          type: integer
          format: int32
    Issuer:
      type: object
      properties:
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
    KeyDescriptor:
      type: object
      properties:
        active:
          type: boolean
        keyGeneratorParams:
          type: object
          additionalProperties:
            type: object
        keyId:
          type: string
        privateKeyAlias:
          type: string
        publicKeyJwk:
          type: object
          additionalProperties:
            type: object
        publicKeyPem:
          type: string
        resourceId:
          type: string
        type:
          type: string
        usage:
          type: array
          items:
            type: string
            enum:
            - sign_credentials
            - sign_presentation
            - sign_token
          uniqueItems: true
    KeyPairResource:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        defaultPair:
          type: boolean
        groupName:
          type: string
        id:
          type: string
        keyContext:
          type: string
        keyId:
          type: string
        participantContextId:
          type: string
        privateKeyAlias:
          type: string
        rotationDuration:
          type: integer
          format: int64
        serializedPublicKey:
          type: string
        state:
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int64
        usage:
          type: array
          items:
            type: string
            enum:
            - sign_credentials
            - sign_presentation
            - sign_token
          uniqueItems: true
        useDuration:
          type: integer
          format: int64
    ParticipantManifest:
      type: object
      properties:
        active:
          type: boolean
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        apiKeyAlias:
          type: string
        did:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/KeyDescriptor"
          uniqueItems: true
        participantContextId:
          type: string
        scopes:
          type: array
          items:
            type: string
        serviceEndpoints:
          type: array
          items:
            $ref: "#/components/schemas/Service"
          uniqueItems: true
    Permission:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/Constraint"
        duties:
          type: array
          items:
            $ref: "#/components/schemas/Duty"
    Policy:
      type: object
      properties:
        '@type':
          type: string
          enum:
          - SET
          - OFFER
          - CONTRACT
        assignee:
          type: string
        assigner:
          type: string
        extensibleProperties:
          type: object
          additionalProperties:
            type: object
        inheritsFrom:
          type: string
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/Duty"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        profiles:
          type: array
          items:
            type: string
        prohibitions:
          type: array
          items:
            $ref: "#/components/schemas/Prohibition"
        target:
          type: string
    Prohibition:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/Action"
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/Constraint"
        remedies:
          type: array
          items:
            $ref: "#/components/schemas/Duty"
    QuerySpec:
      type: object
      properties:
        filterExpression:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        sortField:
          type: string
        sortOrder:
          type: string
          enum:
          - ASC
          - DESC
    RequestedCredential:
      type: object
      properties:
        credentialType:
          type: string
        format:
          type: string
        id:
          type: string
    Service:
      type: object
      properties:
        id:
          type: string
        serviceEndpoint:
          type: string
        type:
          type: string
    VerifiableCredential:
      type: object
      properties:
        '@context':
          type: array
          items:
            type: object
        credentialSchema:
          type: array
          items:
            $ref: "#/components/schemas/CredentialSchema"
        credentialStatus:
          type: array
          items:
            $ref: "#/components/schemas/CredentialStatus"
        credentialSubject:
          type: array
          items:
            $ref: "#/components/schemas/CredentialSubject"
        dataModelVersion:
          type: string
          enum:
          - V_1_1
          - V_2_0
        description:
          type: string
        expirationDate:
          type: string
          format: date-time
        id:
          type: string
        issuanceDate:
          type: string
          format: date-time
        issuer:
          $ref: "#/components/schemas/Issuer"
        name:
          type: string
        type:
          type: array
          items:
            type: string
    VerifiableCredentialContainer:
      type: object
      properties:
        credential:
          $ref: "#/components/schemas/VerifiableCredential"
        format:
          type: string
          enum:
          - VC1_0_LD
          - VC1_0_JWT
          - VC2_0_JOSE
          - VC2_0_SD_JWT
          - VC2_0_COSE
        rawVc:
          type: string
    VerifiableCredentialManifest:
      type: object
      properties:
        id:
          type: string
        issuancePolicy:
          $ref: "#/components/schemas/Policy"
        participantContextId:
          type: string
        reissuancePolicy:
          $ref: "#/components/schemas/Policy"
        verifiableCredentialContainer:
          $ref: "#/components/schemas/VerifiableCredentialContainer"
    VerifiableCredentialResource:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
        credentialStatus:
          type: string
          enum:
          - INITIAL
          - REQUESTING
          - REQUESTED
          - ISSUING
          - ISSUED
          - REVOKED
          - SUSPENDED
          - EXPIRED
          - NOT_YET_VALID
          - ERROR
          writeOnly: true
        holderId:
          type: string
        id:
          type: string
        issuancePolicy:
          $ref: "#/components/schemas/Policy"
        issuerId:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: object
        participantContextId:
          type: string
        reissuancePolicy:
          $ref: "#/components/schemas/Policy"
        state:
          type: integer
          format: int32
        timeOfLastStatusUpdate:
          type: string
          format: date-time
        timestamp:
          type: integer
          format: int64
        usage:
          type: string
          enum:
          - Holder
          - StatusList
          - IssuanceTracking
        verifiableCredential:
          $ref: "#/components/schemas/VerifiableCredentialContainer"
    VerificationMethod:
      type: object
      properties:
        controller:
          type: string
        id:
          type: string
        publicKeyJwk:
          type: object
          additionalProperties:
            type: object
        publicKeyMultibase:
          type: string
        type:
          type: string
  securitySchemes:
    ApiKey:
      in: header
      name: X-Api-Key
      type: apiKey
