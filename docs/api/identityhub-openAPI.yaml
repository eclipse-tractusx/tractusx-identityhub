openapi: 3.0.1
info:
  description: This is the Identity API for manipulating VerifiableCredentials
  title: VerifiableCredentials Identity API
  version: "1"
paths:
  /check/health:
    get:
      description: Performs a liveness probe to determine whether the runtime is working
        properly.
      operationId: checkHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: The runtime is working properly.
      tags:
      - Application Observability
  /check/liveness:
    get:
      description: Performs a liveness probe to determine whether the runtime is working
        properly.
      operationId: getLiveness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: The runtime is working properly.
      tags:
      - Application Observability
  /check/readiness:
    get:
      description: Performs a readiness probe to determine whether the runtime is
        able to accept requests.
      operationId: getReadiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: The runtime is able to accept requests.
      tags:
      - Application Observability
  /check/startup:
    get:
      description: Performs a startup probe to determine whether the runtime has completed
        startup.
      operationId: getStartup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
          description: The runtime has completed startup.
      tags:
      - Application Observability
  /token:
    post:
      operationId: token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding:
              audience:
                style: form
              bearer_access_scope:
                style: form
              client_id:
                style: form
              client_secret:
                style: form
              grant_type:
                style: form
              token:
                style: form
            schema:
              type: object
              properties:
                audience:
                  type: string
                  description: Audience for the SI token
                bearer_access_scope:
                  type: string
                  description: Scope to be added in the VP token
                client_id:
                  type: string
                  description: Id of the client requesting an SI token
                client_secret:
                  type: string
                  description: Secret of the client requesting an SI token
                grant_type:
                  type: string
                  description: "Type of grant: must be set to client_credentials"
                token:
                  type: string
                  description: VP token to be added as a claim in the SI token
              required:
              - audience
              - client_id
              - client_secret
              - grant_type
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StsTokenResponse"
          description: The Self-Issued ID token
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StsTokenErrorResponse"
          description: Invalid Request
      tags:
      - Secure Token Service Api
  /v1/participants/{participantContextId}/credentials:
    post:
      description: Writes a set of credentials into storage
      operationId: storeCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialMessage"
      responses:
        "200":
          description: The credentialMessage was successfully processed and stored
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The given authentication token could not be validated. This\
            \ can happen, when the request body calls for a broader credentialMessage\
            \ scope than the granted scope in the auth token"
      tags:
      - Storage API
  /v1/participants/{participantContextId}/offers:
    post:
      description: Notifies the holder about the availability of a particular credential
        for issuance
      operationId: offerCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              externalDocs:
                description: DCP Credential Offer API
                url: https://eclipse-dataspace-dcp.github.io/decentralized-claims-protocol
      responses:
        "204":
          description: The offer notification was successfully received.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The given authentication token could not be validated.
      tags:
      - Credential Offer API
  /v1/participants/{participantContextId}/presentations/query:
    post:
      description: "Issues a new presentation query, that contains either a DIF presentation\
        \ definition, or a list of scopes"
      operationId: queryPresentation
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: header
        name: Authorization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationQueryMessage"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationResponseMessage"
          description: "The query was successfully processed, the response contains\
            \ the VerifiablePresentation"
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, for example when both scope and\
            \ presentationDefinition are given"
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: No Authorization header was given.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The given authentication token could not be validated. This\
            \ can happen, when the request body calls for a broader query scope than\
            \ the granted scope in the auth token"
        "501":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "When the request contained a presentationDefinition object,\
            \ but the implementation does not support it."
      tags:
      - Presentation API
  /v1/version:
    get:
      description: Gets the versions exposed by the runtime
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionRecord"
          description: The version contexts
      tags:
      - Version
  /v1alpha/credentials:
    get:
      deprecated: true
      description: Get all VerifiableCredentials across all Participant Contexts.
        Requires elevated access.
      operationId: getAllCredentials
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiableCredentialResource"
          description: The list of VerifiableCredential resources.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The query was malformed or was not understood by the server.
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
      tags:
      - Verifiable Credentials
  /v1alpha/dids:
    get:
      deprecated: true
      description: Get all DID documents across all Participant Contexts. Requires
        elevated access.
      operationId: getAllDids
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DidDocument"
          description: The list of DID Documents.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The query was malformed or was not understood by the server.
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
      tags:
      - DID
  /v1alpha/keypairs:
    get:
      deprecated: true
      description: Get all KeyPair resources across all Participant Contexts. Requires
        elevated access.
      operationId: getAllKeyPairs
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyPairResource"
          description: The list of KeyPair resources.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The query was malformed or was not understood by the server.
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
      tags:
      - Key Pairs
  /v1alpha/participants:
    get:
      description: Get all DID documents across all Participant Contexts. Requires
        elevated access.
      operationId: getAllParticipants
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentityHubParticipantContext"
          description: The list of ParticipantContexts.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The query was malformed or was not understood by the server.
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
      tags:
      - Participant Context
    post:
      description: Creates a new ParticipantContext object.
      operationId: createParticipant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantManifest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateParticipantContextResponse"
          description: "The ParticipantContext was created successfully, its API token\
            \ is returned in the response body."
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "409":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Can't create the ParticipantContext, because a object with\
            \ the same ID already exists"
      tags:
      - Participant Context
  /v1alpha/participants/{participantContextId}:
    delete:
      description: Delete a ParticipantContext.
      operationId: deleteParticipant
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The ParticipantContext was deleted successfully
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: A ParticipantContext with the given ID does not exist.
      tags:
      - Participant Context
    get:
      description: Gets ParticipantContexts by ID.
      operationId: getParticipant
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityHubParticipantContext"
          description: The list of ParticipantContexts.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: A ParticipantContext with the given ID does not exist.
      tags:
      - Participant Context
  /v1alpha/participants/{participantContextId}/credentials:
    get:
      description: Query VerifiableCredentials by type.
      operationId: queryCredentialsByType
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiableCredentialResource"
          description: The list of VerifiableCredentials.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: The query was malformed or was not understood by the server.
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
      tags:
      - Verifiable Credentials
    post:
      description: Adds a new VerifiableCredential into the system.
      operationId: addCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiableCredentialManifest"
      responses:
        "204":
          description: The VerifiableCredential was successfully created.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "409":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Could not create VerifiableCredential, because a VerifiableCredential\
            \ with that ID already exists"
      tags:
      - Verifiable Credentials
    put:
      description: Update an existing VerifiableCredential.
      operationId: updateCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiableCredentialManifest"
      responses:
        "204":
          description: The VerifiableCredential was updated successfully.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: VerifiableCredential could not be updated because it does not
            exist.
      tags:
      - Verifiable Credentials
  /v1alpha/participants/{participantContextId}/credentials/discriminator:
    post:
      description: Define a scope discriminator mapping (=short-hand) for the fully-qualified
        credential type
      operationId: addDiscriminatorMapping
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      requestBody:
        description: Mapping between alias (short-hand) and discriminator (fully-qualified
          credential type)
        required: true
      responses:
        "204":
          description: Discriminator mapping added successfully
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
      tags:
      - Verifiable Credentials
  /v1alpha/participants/{participantContextId}/credentials/request:
    post:
      description: Triggers a credential request that is send to the issuer via the
        DCP protocol.
      operationId: requestCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequestDto"
      responses:
        "201":
          description: The request was processed and sent to the issuer. The issuer-created
            ID ("issuerPid") is returned in the response.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "409":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Could not create a credential request, because a credential\
            \ request with that ID already exists"
      tags:
      - Verifiable Credentials
  /v1alpha/participants/{participantContextId}/credentials/request/{holderPid}:
    get:
      description: Finds a credential request by ID.
      operationId: getCredentialRequest
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: path
        name: holderPid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiableCredentialResource"
          description: The VerifiableCredential.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: A VerifiableCredential with the given ID does not exist.
      tags:
      - Verifiable Credentials
  /v1alpha/participants/{participantContextId}/credentials/{credentialId}:
    delete:
      description: Delete a VerifiableCredential.
      operationId: deleteCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: path
        name: credentialId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: The VerifiableCredential was deleted successfully
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: A VerifiableCredential with the given ID does not exist.
      tags:
      - Verifiable Credentials
    get:
      description: Finds a VerifiableCredential by ID.
      operationId: getCredential
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      - in: path
        name: credentialId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiableCredentialResource"
          description: The VerifiableCredential.
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "Request body was malformed, or the request could not be processed"
        "403":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
            \ was missing or was not valid."
        "404":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: A VerifiableCredential with the given ID does not exist.
      tags:
      - Verifiable Credentials
  /v1alpha/participants/{participantContextId}/dids/publish:
    post:
      description: Publish an (existing) DID document. The DID is expected to exist
        in the database.
      operationId: publishDid
      parameters:
      - in: path
        name: participantContextId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DidRequestPayload"
      responses:
        "204":
          description: The DID document was successfully published.
        "401":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: "The request could not be completed, because either the authentication\
