        configuration:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: integer
          format: int64
        id:
          type: string
        lastModifiedAt:
          type: integer
          format: int64
        participantContextId:
          type: string
    AttestationDefinitionRequest:
      type: object
      properties:
        attestationType:
          type: string
        configuration:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
