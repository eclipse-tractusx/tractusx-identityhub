          type: string
        holderId:
          type: string
        name:
          type: string
        properties:
          type: object
          additionalProperties:
            type: object
      required:
      - did
      - holderId
    IdentityHubParticipantContext:
      type: object
      properties:
        apiTokenAlias:
          type: string
        createdAt:
          type: integer
          format: int64
        did:
          type: string
        id:
          type: string
        lastModified:
          type: integer
          format: int64
        participantContextId:
          type: string
        properties:
          type: object
          additionalProperties:
            type: object
        roles:
          type: array
          items:
            type: string
        state:
          type: integer
          format: int32
    IssuanceProcessDto:
      type: object
      properties:
        claims:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: integer
          format: int64
        credentialDefinitions:
          type: array
          items:
            type: string
        credentialFormats:
          type: object
          additionalProperties:
            type: string
            enum:
            - VC1_0_LD
            - VC1_0_JWT
            - VC2_0_JOSE
            - VC2_0_SD_JWT
            - VC2_0_COSE
        holderId:
          type: string
        holderPid:
          type: string
        id:
          type: string
        participantContextId:
          type: string
        state:
          type: string
        updatedAt:
          type: integer
          format: int64
    Issuer:
      type: object
      properties:
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
    IssuerMetadata:
      type: object
      example:
        '@context':
        - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
        type: IssuerMetadata
        credentialIssuer: did:web:issuer-url
        credentialsSupported:
        - type: CredentialObject
          credentialType: MembershipCredential
          offerReason: reissue
          bindingMethods:
          - did:web
          profiles:
          - vc20-bssl/jwt
          - vc10-sl2021/jwt
          - '...'
          issuancePolicy:
            id: Scalable trust example
            input_descriptors:
            - id: pd-id
              constraints:
                fields:
                - path:
                  - $.vc.type
                  filter:
                    type: string
                    pattern: ^AttestationCredential$
      properties:
        '@context':
          type: object
        credentialIssuer:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - '@context'
      - credentialIssuer
      - status
      - type
    JsonObject:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      properties:
        empty:
          type: boolean
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    JsonValue:
      type: object
      properties:
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    KeyDescriptor:
      type: object
      properties:
        active:
          type: boolean
        keyGeneratorParams:
          type: object
          additionalProperties:
            type: object
        keyId:
          type: string
        privateKeyAlias:
          type: string
        publicKeyJwk:
          type: object
          additionalProperties:
            type: object
        publicKeyPem:
          type: string
        resourceId:
          type: string
        type:
          type: string
        usage:
          type: array
          items:
            type: string
            enum:
            - sign_credentials
