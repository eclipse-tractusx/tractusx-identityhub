      properties:
        apiKey:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
    CredentialDefinition:
      type: object
      properties:
        additionalContext:
          type: array
          items:
            type: string
        attestations:
          type: array
          items:
            type: string
        createdAt:
          type: integer
          format: int64
        credentialType:
          type: string
        format:
          type: string
        id:
          type: string
        jsonSchema:
          type: string
        jsonSchemaUrl:
          type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/MappingDefinition"
        participantContextId:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRuleDefinition"
        validity:
          type: integer
          format: int64
    CredentialDefinitionDto:
      type: object
      properties:
        attestations:
          type: array
          items:
            type: string
        credentialType:
          type: string
        format:
          type: string
        id:
          type: string
        jsonSchema:
          type: string
        jsonSchemaUrl:
          type: string
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/MappingDefinition"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRuleDefinition"
        validity:
          type: integer
          format: int64
    CredentialOfferDto:
      type: object
      properties:
        credentials:
          type: array
          items:
            type: string
        holderId:
          type: string
      required:
      - credentials
      - holderId
    CredentialRequest:
      type: object
      example:
        credentialType: MembershipCredential
        format: vcdm11_jwt
      properties:
        credentialType:
          type: string
        format:
          type: string
      required:
      - credentialType
      - format
    CredentialRequestMessage:
      type: object
      example:
        '@context':
        - https://w3id.org/dspace-dcp/v1.0/dcp.jsonld
        type: CredentialRequestMessage
        credentials:
        - credentialType: MembershipCredential
          format: vcdm11_jwt
        - credentialType: OrganizationCredential
          format: vcdm11_ld
        - credentialType: Iso9001Credential
          format: vcdm20_jose
      properties:
        '@context':
          type: object
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRequest"
      required:
      - '@context'
      - credentials
    CredentialRuleDefinition:
      type: object
      properties:
        configuration:
          type: object
          additionalProperties:
            type: object
        type:
          type: string
    CredentialSchema:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
    CredentialStatus:
      type: object
      properties:
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        id:
          type: string
        type:
          type: string
    CredentialStatusResponse:
      type: object
      properties:
