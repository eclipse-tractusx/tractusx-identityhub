[metadata]
format.version = "1.1"

[versions]
edc = "1.0.0-RC4"
edc-build = "1.5.2"
opentelemetry = "2.27.0"
postgres = "42.7.8"
flyway = "12.5.0"
testcontainers = "2.0.5"
jakarta-rs = "4.0.0"
rest-assured = "6.0.0"


[libraries]
# upstream EDC dependencies
edc-spi-core = { module = "org.eclipse.edc:core-spi", version.ref = "edc" }
edc-core-jersey = { module = "org.eclipse.edc:jersey-core", version.ref = "edc" }
edc-ih-api-participant = { module = "org.eclipse.edc:participant-context-api", version.ref = "edc" }
edc-ih-api-credentials = { module = "org.eclipse.edc:verifiable-credentials-api", version.ref = "edc" }
edc-ih-validators-participant = { module = "org.eclipse.edc:participant-context-validators", version.ref = "edc" }
edc-ih-validators-credential = { module = "org.eclipse.edc:verifiable-credential-validators", version.ref = "edc" }
edc-runtime-metamodel = { module = "org.eclipse.edc:runtime-metamodel", version.ref = "edc" }

# EDC modules
edc-lib-core = { module = "org.eclipse.edc:core-lib", version.ref = "edc" }
edc-core-security = { module = "org.eclipse.edc:security-core", version.ref = "edc" }
edc-core-sql = { module = "org.eclipse.edc:sql-core", version.ref = "edc" }
edc-junit = { module = "org.eclipse.edc:junit", version.ref = "edc" }
edc-vault-hashicorp = { module = "org.eclipse.edc:vault-hashicorp", version.ref = "edc" }
edc-sql-stsstore-sql = { module = "org.eclipse.edc:sts-client-store-sql", version.ref = "edc" }
edc-build-plugin = { module = "org.eclipse.edc.edc-build:org.eclipse.edc.edc-build.gradle.plugin", version.ref = "edc-build" }

# EDC SPIs
edc-spi-controlplane = { module = "org.eclipse.edc:control-plane-spi", version.ref = "edc" }

# BOM modules
bom-issuer = { module = "org.eclipse.edc:issuerservice-bom", version.ref = "edc" }
bom-issuer-sql = { module = "org.eclipse.edc:issuerservice-feature-sql-bom", version.ref = "edc" }

# IdentityHub modules
edc-ih-core-keypairs = { module = "org.eclipse.edc:identity-hub-keypairs", version.ref = "edc" }
edc-ih-spi = { module = "org.eclipse.edc:identity-hub-spi", version.ref = "edc" }
edc-ih-participantcontext-config-store-sql = { module = "org.eclipse.edc:participantcontext-config-store-sql", version.ref = "edc" }
edc-ih-spi-participant-context = { module = "org.eclipse.edc:participant-context-spi", version.ref = "edc" }
edc-ih-spi-sts = { module = "org.eclipse.edc:sts-spi", version.ref = "edc" }
edc-ih-core-participants = { module = "org.eclipse.edc:identity-hub-participants", version.ref = "edc" }

# IdentityHub BOM modules
bom-ih = { module = "org.eclipse.edc:identityhub-bom", version.ref = "edc" }
bom-ih-sql = { module = "org.eclipse.edc:identityhub-feature-sql-bom", version.ref = "edc" }

# Third party libs
jakarta-rs = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-rs" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
opentelemetry-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "opentelemetry" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }

testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.5.1" }
