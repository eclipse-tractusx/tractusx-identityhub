{{- $fullName := include "issuerservice.fullname" . }}
{{- $controlLabels := include "issuerservice.server.labels" . }}
{{- $controlEdcEndpoints := .Values.issuerservice.endpoints }}
{{- $namespace := .Release.Namespace }}

{{- range .Values.issuerservice.httpRoutes }}
{{- if and .enabled .endpoints }}
{{- $hostname := .hostname | lower }}
{{- $safeHostname := regexReplaceAll "[^a-z0-9.-]" ($hostname | replace "*" "wildcard") "-" | trimAll "-." }}
{{- $routeName := printf "%s-%s" $fullName $safeHostname }}
{{- if or (gt (len $routeName) 253) (gt (len (printf "%s-%s" $fullName (first (splitList "." $safeHostname)))) 63) }}
{{- $routeName = printf "%s-%s" $fullName (sha256sum $hostname | trunc 10) }}
{{- end }}
{{- $annotations := .annotations | default dict }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ $namespace }}
  labels:
    {{- $controlLabels | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    {{- $routeEndpoints := .endpoints }}
    {{- range $name, $mapping := $controlEdcEndpoints }}
    {{- if (has $name $routeEndpoints) }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $mapping.path }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $mapping.port }}
          weight: 1
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
